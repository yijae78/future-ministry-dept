name: mac-probe
# 맥 원클릭 설치 기술 검증(설치 100% 전략 · 2026-09-03) — 실제 macOS 러너에서
#  ① 로컬 생성 URL 수신부 앱(osacompile)이 cys-install:// 스킴을 받는가
#  ② upstream DMG 의 cys.app 번들 배치(cys·cysd·runtime python/git/node)가 가정과 같은가
# 이 워크플로는 검증 전용이며 유저 배달 경로(main)와 무관하다.
on:
  push:
    branches: [fix/install-100]
    paths: [".github/workflows/mac-probe.yml"]
  workflow_dispatch:

jobs:
  url-handler:
    name: "① 로컬 URL 수신부 앱 (osacompile · 서명 없음)"
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: 수신부 앱 생성 + 스킴 등록
        shell: bash
        run: |
          set -euxo pipefail
          APP="$HOME/Applications/FM-Install-Receiver.app"
          mkdir -p "$HOME/Applications"
          cat > /tmp/handler.applescript <<'EOF'
          on open location theURL
            set homeDir to POSIX path of (path to home folder)
            do shell script "mkdir -p " & quoted form of (homeDir & ".fm-probe") & " && printf '%s\\n' " & quoted form of theURL & " >> " & quoted form of (homeDir & ".fm-probe/received.txt")
          end open location
          on run
            -- URL 없이 열리면 아무것도 하지 않는다
          end run
          EOF
          osacompile -o "$APP" /tmp/handler.applescript
          PL="$APP/Contents/Info.plist"
          PB=/usr/libexec/PlistBuddy
          $PB -c "Set :CFBundleIdentifier fm.cys-install.receiver" "$PL" || $PB -c "Add :CFBundleIdentifier string fm.cys-install.receiver" "$PL"
          $PB -c "Add :CFBundleURLTypes array" "$PL"
          $PB -c "Add :CFBundleURLTypes:0 dict" "$PL"
          $PB -c "Add :CFBundleURLTypes:0:CFBundleURLName string fm.cys-install" "$PL"
          $PB -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PL"
          $PB -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string cys-install" "$PL"
          LSREG=/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister
          "$LSREG" -f "$APP"
          xattr -l "$APP" || true
          "$LSREG" -dump 2>/dev/null | grep -i -B2 -A6 "cys-install" | head -40 || true
      - name: URL 발화 → 수신 확인
        shell: bash
        run: |
          set -euxo pipefail
          open "cys-install://dept/future-ministry"
          for i in $(seq 1 30); do [ -f "$HOME/.fm-probe/received.txt" ] && break; sleep 1; done
          echo "--- received ---"; cat "$HOME/.fm-probe/received.txt"
          grep -q "cys-install://dept/future-ministry" "$HOME/.fm-probe/received.txt"
          open "cys-install://tech/frar"
          sleep 3
          grep -q "cys-install://tech/frar" "$HOME/.fm-probe/received.txt"
          echo "RESULT: url-handler OK ($(sw_vers -productVersion) $(uname -m))"

  bundle-layout:
    name: "② upstream DMG 번들 배치 검증"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest   # Apple Silicon
            asset: cys_0.14.29_aarch64.dmg
          - runner: macos-15-intel       # Intel
            asset: cys_0.14.29_x64.dmg
    steps:
      - name: DMG 내려받기·마운트·복사
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL -o /tmp/cys.dmg "https://github.com/idoforgod/cys-terminal/releases/download/v0.14.29/${{ matrix.asset }}"
          MNT=$(hdiutil attach /tmp/cys.dmg -nobrowse -readonly | awk -F'\t' '/\/Volumes\//{print $NF}' | tail -1)
          ls -la "$MNT"; ls -la "$MNT/.support" 2>/dev/null || true
          # DMG 는 드래그형이 아니다: 'Install cys.app'(도우미)가 숨은 .support/cys.app 을 /Applications 에 넣는다.
          # 헤드리스에서는 도우미(GUI 다이얼로그) 대신 실제 번들(Contents/MacOS/cys 보유)을 직접 복사한다.
          APP=""
          for c in "$MNT/.support/cys.app" $(find "$MNT" -maxdepth 3 -type d -name "*.app" 2>/dev/null); do
            if [ -x "$c/Contents/MacOS/cys" ]; then APP="$c"; break; fi
          done
          echo "APP=$APP"; [ -n "$APP" ] || { echo "cys.app(Contents/MacOS/cys) 를 DMG 에서 찾지 못함" >&2; exit 1; }
          ditto "$APP" /Applications/cys.app
          hdiutil detach "$MNT" || true
      - name: 번들 배치·런타임 실행 확인
        shell: bash
        run: |
          set -euxo pipefail
          B=/Applications/cys.app
          echo "BUNDLE=$B"; [ -x "$B/Contents/MacOS/cys" ]
          xattr -l "$B" | head -3 || true
          # 순정 맥 가정 검증: /usr/local/bin 에 cys 심볼릭이 없어야 한다(「셸에 cys 설치」 미클릭 상태)
          ls -la /usr/local/bin/cys 2>/dev/null && echo "NOTE: /usr/local/bin/cys exists on runner" || echo "OK: no /usr/local/bin/cys (pristine)"
          # pack 확보 경로: GUI 없이 cys init-pack → ~/.cys/pack/bin/cys-dept
          "$B/Contents/MacOS/cys" init-pack 2>&1 | tail -3 || true
          ls -la "$HOME/.cys/pack/bin/cys-dept" && head -1 "$HOME/.cys/pack/bin/cys-dept"
          ls -la "$B/Contents/MacOS" "$B/Contents/Resources" | head -40
          echo "--- runtime tree(depth 3) ---"; find "$B/Contents/Resources/runtime" -maxdepth 3 2>/dev/null | head -60
          echo "--- 실행체 후보(심볼릭 포함) ---"; find "$B/Contents/Resources/runtime" -maxdepth 4 \( -name python3 -o -name python3.12 -o -name git -o -name node -o -name bash -o -name uv \) \( -type f -o -type l \) 2>/dev/null | head -20
          codesign -dv "$B" 2>&1 | head -5 || true
          spctl -a -vv "$B" 2>&1 | head -3 || true
          "$B/Contents/MacOS/cys" --version
          "$B/Contents/MacOS/cysd" --version 2>&1 | head -1 || true
          # 스펙 §2 고정 경로 그대로 검증(해석기 계약) — 심볼릭이어도 실행되면 된다
          PY="$B/Contents/Resources/runtime/python/bin/python3";  [ -x "$PY" ]   || PY=$(find "$B/Contents/Resources/runtime" -path "*python*/bin/python3*" \( -type f -o -type l \) | head -1)
          GIT="$B/Contents/Resources/runtime/git/bin/git";        [ -x "$GIT" ]  || GIT=$(find "$B/Contents/Resources/runtime" -path "*git*/bin/git" \( -type f -o -type l \) | head -1)
          NODE="$B/Contents/Resources/runtime/node/bin/node";     [ -x "$NODE" ] || NODE=$(find "$B/Contents/Resources/runtime" -path "*node*/bin/node" \( -type f -o -type l \) | head -1)
          echo "PY=$PY GIT=$GIT NODE=$NODE"
          "$PY" --version; "$GIT" --version; "$NODE" --version
          # cys-dept 가 요구하는 bare 이름 해석이 PATH 선두 주입으로 만족되는지(스펙 §2 실행 env)
          export PATH="$B/Contents/MacOS:$(dirname "$PY"):$(dirname "$GIT"):$(dirname "$NODE"):/usr/bin:/bin"
          command -v cys; command -v cysd; command -v python3; command -v git; command -v node
          python3 -c "import fcntl,json,sys;print('fcntl ok',sys.version.split()[0])"
          echo "BASH=$(bash --version | head -1)"
          echo "RESULT: bundle-layout OK ($(sw_vers -productVersion) $(uname -m))"
